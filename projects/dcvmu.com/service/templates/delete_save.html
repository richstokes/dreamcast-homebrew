{% extends 'base.html' %}{% block title %}Delete save{% endblock %}{% block content %}
<section class="form-panel"><h1>Delete save?</h1><p>Permanently delete <strong>{{ save.name }}</strong> ({{ save.game }}, version {{ save.revision }}) from your account?</p><p>This cannot be undone.</p><form method="post" action="{{ url_for('delete_save', sid=save.id) }}"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="revision" value="{{ save.revision }}"><input type="hidden" name="confirm" value="yes"><p><input class="danger" type="submit" value="Yes, delete save"></p><p><a href="{{ url_for('detail', sid=save.id) }}">Cancel</a></p></form></section>
{% endblock %}
