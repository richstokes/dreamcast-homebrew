name: Build Dreamcast releases

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  KOS_COMMIT: d81aa3fda0520b6ca64098ce9d1d43e7562142d9
  KOS_PORTS_COMMIT: f4faacc42faaf552625777b7709e871a827e1055
  MKDCDISC_COMMIT: a663882c4ac0e2123c6229af6dd596cee7a66dc1
  TOOLCHAIN_IMAGE: pcercuei/dreamcast-toolchain@sha256:62ed5653ac1c71c7323942dda3f32033db56a4830625187681f5329f623e6c9f

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # A push to main stops any older build still running, so the newest
    # commit gets the runner. Publishing is a separate job that is never
    # cancelled.
    concurrency:
      group: dreamcast-release-build
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out pinned SH4ZAM
        run: |
          tools/update-sh4zam.sh \
            projects/apps/pico8-dreamcast/third_party/sh4zam \
            projects/games/drift-los-angeles/third_party/sh4zam \
            projects/games/dreamkarts/third_party/sh4zam \
            projects/games/totally-bazaar/third_party/sh4zam

      - name: Set up Python for service and launcher checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv for Python packages
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.14'

      - name: Test DCVMU service and VMU launcher
        run: |
          uv venv --python python projects/dcvmu.com/service/.venv
          uv pip install --python projects/dcvmu.com/service/.venv/bin/python -r projects/dcvmu.com/service/requirements.txt
          (cd projects/dcvmu.com/service && .venv/bin/python -m unittest -v)
          projects/dcvmu.com/service/.venv/bin/python -m unittest discover -s projects/dcvmu.com/client/tests -v

      - name: Test Dreamcast Browser parser and UI logic
        run: make -C projects/apps/dreamcast-browser/tests

      - name: Test Dreamcast BASIC interpreter, games, and editor
        run: make -C projects/apps/dreamcast-basic/tests check

      - name: Verify PICO-8 sample cartridges and license notices
        run: uv run projects/apps/pico8-dreamcast/tests/check_samples.py

      - name: Install disc-image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libisofs-dev libpng-dev meson ninja-build

      - name: Install pinned SH-4 compiler toolchain
        run: docker pull "$TOOLCHAIN_IMAGE"

      # DreamKarts' music comes from dcvmu.com as mp3s and goes onto its disc
      # as CD-DA tracks; the script needs only python3 and ffmpeg, so it runs
      # here on the runner and the packaging step finds the WAVs in cdda/.
      - name: Fetch and press DreamKarts' music
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update && sudo apt-get install --yes ffmpeg; }
          python3 projects/games/dreamkarts/tools/build_music.py

      # KallistiOS and kos-ports take ~2.5 minutes to build and only change
      # with their pins, their patches, the compiler image or the scripts that
      # fetch, patch and build them, so the built SDK is cached on exactly those.
      - name: Work out the SDK cache key
        id: sdk-key
        run: |
          hash=$(
            {
              printf '%s\n' "$KOS_COMMIT" "$KOS_PORTS_COMMIT" "$TOOLCHAIN_IMAGE"
              cat .github/scripts/fetch-sdk.sh \
                .github/scripts/build-sdk-in-container.sh \
                tools/kos/apply-patches.sh \
                tools/kos/patches/*/*.patch
            } | sha256sum | cut -c1-16
          )
          echo "key=kos-sdk-$hash" >> "$GITHUB_OUTPUT"

      - name: Restore built KallistiOS and kos-ports
        id: sdk-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .ci/kos
            .ci/kos-ports
          key: ${{ steps.sdk-key.outputs.key }}

      - name: Check out pinned KallistiOS and kos-ports
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: .github/scripts/fetch-sdk.sh

      - name: Build KallistiOS and kos-ports
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$TOOLCHAIN_IMAGE" \
            sh .github/scripts/build-sdk-in-container.sh

      # Saved straight away, so a project that fails to build later in the run
      # does not cost the next run another SDK build.
      - name: Save built KallistiOS and kos-ports
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .ci/kos
            .ci/kos-ports
          key: ${{ steps.sdk-key.outputs.key }}

      - name: Check out pinned mkdcdisc
        run: |
          mkdir -p .ci
          git init .ci/mkdcdisc
          git -C .ci/mkdcdisc remote add origin https://gitlab.com/simulant/mkdcdisc.git
          git -C .ci/mkdcdisc fetch --depth 1 origin "$MKDCDISC_COMMIT"
          git -C .ci/mkdcdisc checkout --detach FETCH_HEAD

      - name: Build every project
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$TOOLCHAIN_IMAGE" \
            sh .github/scripts/build-in-container.sh

      - name: Validate Dreamcast executables
        run: |
          while IFS='|' read -r directory slug title; do
            elf="$directory/$slug.elf"
            file "$elf" | tee /dev/stderr | grep -q 'ELF 32-bit LSB executable, Renesas SH'
            docker run --rm \
              --volume "$GITHUB_WORKSPACE:/workspace" \
              --workdir /workspace \
              "$TOOLCHAIN_IMAGE" \
              /opt/toolchains/dc/sh-elf/bin/sh-elf-readelf -h "$elf" \
              | grep -q 'Machine:.*Renesas / SuperH SH'
          done < .github/console-projects.txt

      - name: Build self-booting CDI images
        run: |
          meson setup .ci/mkdcdisc/build .ci/mkdcdisc -Dpng=enabled
          meson compile -C .ci/mkdcdisc/build
          .github/scripts/package-releases.sh .ci/mkdcdisc/build/mkdcdisc dist
          sha256sum dist/*.cdi dist/*.zip dist/*.elf > dist/SHA256SUMS

      # The discs are already compressed, so zipping them again only costs time.
      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Cancelling this between deleting and recreating the release would leave
    # no release at all, so a newer build's publish waits for it instead.
    concurrency:
      group: dreamcast-release-publish
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha=${GITHUB_SHA::7}
          git tag --force continuous "$GITHUB_SHA"
          git push --force origin refs/tags/continuous

          cat > release-notes.md <<EOF
          Automatic builds from main at commit \`$short_sha\`.

          - **CDI** files are compact, self-booting Dreamcast disc images for Flycast, other Dreamcast emulators, or GDEMU.
          - **-cdr.zip** files hold the same disc padded to a full CD, for burning to CD-R. Unzip first; the CDI inside is ~740 MB.
          - **ELF** files are included for direct loading and development workflows, except where the game needs its disc (DreamKarts plays its music as CD audio tracks), which ships as a CDI only.
          - Verify downloads with \`SHA256SUMS\`.
          EOF

          # Editing a release preserves its original published_at timestamp.
          # Recreate this rolling release so GitHub's visible date matches the
          # commit, notes, and assets produced by the current successful run.
          if gh release view continuous >/dev/null 2>&1; then
            gh release delete continuous --yes
          fi

          gh release create continuous dist/* \
            --verify-tag \
            --title "Latest Dreamcast builds" \
            --notes-file release-notes.md \
            --latest
