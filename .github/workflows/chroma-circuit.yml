name: Chroma Circuit

on:
  push:
    branches:
      - main
    tags:
      - "chroma-circuit-v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chroma-circuit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build bare-metal SH-4 ELF
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      PROJECT_DIR: projects/chroma-circuit
      TOOLCHAIN: /usr/bin

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install SuperH binutils
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils-sh-elf file make
          sh-elf-as --version
          dpkg-query -W binutils-sh-elf

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          make clean
          make --jobs=2

      - name: Verify Dreamcast ELF
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          make verify

          header="$(sh-elf-readelf -h chroma-circuit.elf)"
          grep -Eq 'Class:[[:space:]]+ELF32' <<<"$header"
          grep -Eq "Data:[[:space:]]+2's complement, little endian" <<<"$header"
          grep -Eq 'Machine:[[:space:]]+Renesas / SuperH SH' <<<"$header"
          grep -Eq 'Flags:.*sh4' <<<"$header"

          sh-elf-readelf -lW chroma-circuit.elf |
            awk '$1 == "LOAD" { count++ }
                 END { exit count == 2 ? 0 : 1 }'

          sh-elf-size chroma-circuit.elf

      - name: Prepare build artifact
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          artifact_dir="${RUNNER_TEMP}/chroma-circuit-artifact"
          mkdir -p "$artifact_dir"
          install -m 0644 chroma-circuit.elf "$artifact_dir/"

          sh-elf-readelf -h -lW chroma-circuit.elf \
            > "$artifact_dir/ELF-HEADERS.txt"
          sh-elf-size chroma-circuit.elf \
            > "$artifact_dir/SIZE.txt"
          dpkg-query -W -f='${Package} ${Version}\n' binutils-sh-elf \
            > "$artifact_dir/TOOLCHAIN.txt"

          (
            cd "$artifact_dir"
            sha256sum chroma-circuit.elf > SHA256SUMS
          )

      - name: Upload ELF
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: chroma-circuit-${{ github.sha }}
          path: ${{ runner.temp }}/chroma-circuit-artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
